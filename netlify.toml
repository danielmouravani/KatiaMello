[build]
  command = "npm run build"
  publish = "dist"

# Headers globais de segurança, compressão e cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML: revalidação rápida para TTFB otimizado
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Assets estáticos compilados pelo Vite (hashes únicos): cache imutável de 1 ano
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=UTF-8"
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/ai-catalog.json"
  [headers.values]
    Content-Type = "application/json; charset=UTF-8"
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/.well-known/ai-catalog.json"
  [headers.values]
    Content-Type = "application/json; charset=UTF-8"
    Cache-Control = "public, max-age=86400, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

